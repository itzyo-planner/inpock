<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>itzyo | 잇지요</title>
  <meta name="description" content="itzyo 잇지요 링크 모음" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ticker-wrap">
    <div class="ticker">
      <span>🛒&nbsp; 쿠팡파트너스 활동의 일환으로, 이에 따른 일정의 수수료를 제공받습니다 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
      <span>🛒&nbsp; 쿠팡파트너스 활동의 일환으로, 이에 따른 일정의 수수료를 제공받습니다 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
    </div>
  </div>
  <main class="container">
    <div class="profile">
      <div class="profile-row">
        <div class="avatar" id="avatar">
          <img id="avatar-img" src="images/profile.jpg" alt="프로필 사진" class="avatar-img"
            onerror="this.style.display='none'; document.getElementById('avatar-fallback').style.display='flex';" />
          <span id="avatar-fallback" class="avatar-fallback">잇</span>
        </div>
        <div class="profile-info">
          <div class="profile-name-row">
            <h1 class="name" id="profile-name">잇지요</h1>
            <button class="share-icon-btn" onclick="copySiteLink()" title="링크 복사">
              <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
            </button>
          </div>
          <p class="handle" id="profile-handle">@itzyo</p>
          <p class="bio" id="profile-bio">
            좋은 상품을 함께 나눠요 ✨<br />
            쿠팡파트너스 활동을 통해<br />
            일정액의 수수료를 제공받을 수 있습니다.
          </p>
        </div>
      </div>
      <a id="contact-email-btn" href="#" style="display:none;align-items:center;gap:6px;background:#fff7ed;border:1.5px solid #fed7aa;border-radius:20px;padding:5px 14px;font-size:0.8rem;font-weight:600;color:#c2410c;text-decoration:none;margin-top:8px;width:fit-content">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        비지니스 제안
      </a>
      <div class="socials" id="socials">
        <a href="https://www.instagram.com/itzyo_in" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Instagram" style="color:#e1306c">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
        </a>
      </div>
    </div>

    <a href="./" class="back-btn" id="back-btn" style="display:none">← 전체 상품 보기</a>

    <div class="filter-wrap" id="filter-wrap" style="display:none">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" type="text" id="search-input" placeholder="상품 검색..." oninput="onSearch(this.value)" />
      </div>
      <div class="cat-tabs" id="cat-tabs"></div>
    </div>

    <div class="links" id="links-container">
      <a href="https://link.coupang.com/a/ecEPYO" target="_blank" rel="noopener noreferrer" class="link-card">
        <div class="link-icon red">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
        </div>
        <div class="link-text">
          <span class="link-title">쿠팡파트너스</span>
          <span class="link-desc">추천 상품 모음</span>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="arrow">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </a>
    </div>

    <footer>© 2026 itzyo · 잇지요</footer>
  </main>

  <div id="toast" class="toast"></div>

  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"885de37df13d47e8b1fca8d339f08467"}'></script>
  <script>
    const TRACKER_URL = 'https://inpock-tracker.kawoohyun.workers.dev';
    const SITE_ID = 'inpock';

    const SOCIAL_ICONS = {
      instagram: { color:'#e1306c', svg:`<svg width="17" height="17" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>` },
      threads:   { color:'#000000', svg:`<svg width="17" height="17" fill="currentColor" viewBox="0 0 192 192"><path d="M141.537 88.988a66.667 66.667 0 00-2.518-1.143c-1.482-27.307-16.403-42.94-41.457-43.1h-.34c-14.986 0-27.449 6.396-35.12 18.036l13.779 9.452c5.73-8.695 14.724-10.548 21.348-10.548h.229c8.249.053 14.474 2.452 18.503 7.129 2.932 3.405 4.893 8.111 5.864 14.05-7.314-1.243-15.224-1.626-23.68-1.14-23.82 1.372-39.134 15.265-38.105 34.569.522 9.792 5.4 18.216 13.735 23.719 7.047 4.652 16.124 6.927 25.557 6.412 12.458-.683 22.231-5.436 29.049-14.127 5.178-6.6 8.453-15.153 9.899-25.93 5.937 3.583 10.337 8.298 12.767 13.966 4.132 9.635 4.373 25.468-8.546 38.376-11.319 11.308-24.929 16.2-45.488 16.351-22.809-.169-40.06-7.484-51.275-21.742C35.236 139.966 29.808 120.682 29.605 96c.203-24.682 5.63-43.966 16.133-57.317C56.954 24.425 74.205 17.11 97.014 16.94c22.975.17 40.526 7.52 52.171 21.847 5.71 7.026 10.015 15.86 12.853 26.162l16.147-4.308c-3.44-12.68-8.853-23.606-16.219-32.668C147.036 9.607 125.202.195 97.28 0h-.483C69.008.195 47.396 9.642 32.79 28.08 19.884 44.487 13.226 67.315 13.001 95.932L13 96v.067c.226 28.617 6.884 51.445 19.791 67.854C47.397 182.358 69.008 191.805 96.797 192h.483c24.906-.189 42.353-6.713 56.818-21.163 18.868-18.845 18.291-42.632 12.08-57.148-4.452-10.383-13.016-18.874-24.64-24.701zm-41.989 39.21c-10.427.585-21.253-4.087-21.743-14.105-.367-6.917 4.927-14.637 21.054-15.565 1.844-.106 3.653-.159 5.433-.159 6.253 0 12.1.61 17.365 1.782-1.974 24.62-11.61 27.538-22.109 28.047z"/></svg>` },
      youtube:   { color:'#ff0000', svg:`<svg width="17" height="17" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136C4.495 20.455 12 20.455 12 20.455s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>` }
    };

    function renderSocials(c) {
      const socials = document.getElementById('socials');
      if (!socials) return;
      const entries = [
        { url: c.instagram, type: 'instagram', label: 'Instagram' },
        { url: c.threads,   type: 'threads',   label: 'Threads' },
        { url: c.threads2,  type: 'threads',   label: 'Threads' },
        { url: c.youtube,   type: 'youtube',   label: 'YouTube' },
        { url: c.youtube2,  type: 'youtube',   label: 'YouTube' },
      ].filter(e => e.url && e.url.trim());
      if (!entries.length) return;
      socials.innerHTML = entries.map(e => {
        const ic = SOCIAL_ICONS[e.type];
        return `<a href="${e.url}" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="${e.label}" style="color:${ic.color}">${ic.svg}</a>`;
      }).join('');
    }

    const LINK_ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>`;
    const ARROW_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="arrow"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>`;

    function loadGA(id) {
      if (!id) return;
      const s = document.createElement('script');
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
      s.async = true;
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function() { dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', id);
    }

    function trackClick(num, title) {
      if (window.gtag) gtag('event', 'link_click', { product_num: num, product_title: title });
      if (num) fetch(TRACKER_URL + '/click', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({site: SITE_ID, num: String(num)})
      }).catch(()=>{});
    }

    fetch(TRACKER_URL + '/click', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({site: SITE_ID, num: 'pv'})
    }).catch(()=>{});

    function copySiteLink() {
      const url = location.origin + location.pathname;
      navigator.clipboard.writeText(url).then(() => showToast('사이트 링크가 복사됐어요! 🔗')).catch(() => {
        const el = document.createElement('textarea');
        el.value = url; el.style.position = 'fixed'; el.style.opacity = '0';
        document.body.appendChild(el); el.select(); document.execCommand('copy');
        document.body.removeChild(el); showToast('사이트 링크가 복사됐어요! 🔗');
      });
    }

    function copyLink(num) {
      const url = location.origin + location.pathname + '?p=' + num;
      navigator.clipboard.writeText(url).then(() => showToast('링크가 복사됐어요! 🔗')).catch(() => {
        const el = document.createElement('textarea');
        el.value = url; el.style.position = 'fixed'; el.style.opacity = '0';
        document.body.appendChild(el); el.select(); document.execCommand('copy');
        document.body.removeChild(el); showToast('링크가 복사됐어요! 🔗');
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._tid);
      t._tid = setTimeout(() => t.classList.remove('show'), 2200);
    }

    let allLinks = [];
    let activeCategory = '전체';
    let searchQuery = '';
    let directNum = new URLSearchParams(location.search).get('p');

    function linkCardHTML(link) {
      if (link.type === 'text') {
        return `<div class="text-block">${(link.title || '').replace(/\n/g, '<br>')}</div>`;
      }
      const thumb = link.thumbnail
        ? `<img src="${link.thumbnail}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;" onerror="this.parentElement.innerHTML=''" />`
        : '';
      const shareBtn = link.num ? `<button class="share-btn" onclick="event.preventDefault();event.stopPropagation();copyLink(${link.num})" title="링크 복사"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg></button>` : '';
      return `
        <a href="${link.url || '#'}" target="_blank" rel="noopener noreferrer" class="link-card" onclick="trackClick(${link.num||0},'${(link.title||'').replace(/'/g,"\\'")}')">
          ${link.thumbnail ? `<div class="link-thumb">${thumb}</div>` : `<div class="link-icon red">${LINK_ICON_SVG}</div>`}
          <div class="link-text">
            <span class="link-title">${link.num ? `<span class="link-num">#${link.num}</span>` : ''}${link.title || ''}</span>
            ${link.desc ? `<span class="link-desc">${link.desc}</span>` : ''}
          </div>
          ${shareBtn}
          ${ARROW_SVG}
        </a>`;
    }

    function getCategories() {
      const cats = [];
      allLinks.forEach(l => { if (l.category && !cats.includes(l.category)) cats.push(l.category); });
      return cats;
    }

    function renderCategoryTabs() {
      const cats = getCategories();
      if (cats.length === 0) { document.getElementById('cat-tabs').innerHTML = ''; return; }
      const all = ['전체', ...cats];
      document.getElementById('cat-tabs').innerHTML = all.map(cat =>
        `<button class="cat-tab${cat === activeCategory ? ' active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`
      ).join('');
    }

    function renderFiltered() {
      const q = searchQuery.toLowerCase().trim();
      const isNumQuery = /^\d+$/.test(q);
      const filtered = allLinks.filter(l => {
        if (l.enabled === false) return false;
        if (directNum) return String(l.num) === String(directNum);
        if (activeCategory !== '전체' && l.category !== activeCategory) return false;
        if (q) {
          if (isNumQuery) return String(l.num || '').includes(q);
          if (!(l.title||'').toLowerCase().includes(q) && !(l.desc||'').toLowerCase().includes(q)) return false;
        }
        return true;
      });
      const container = document.getElementById('links-container');
      container.innerHTML = filtered.length
        ? filtered.map(linkCardHTML).join('')
        : '<div class="no-result">상품을 찾을 수 없습니다 😢</div>';
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderCategoryTabs();
      renderFiltered();
    }

    function onSearch(val) {
      searchQuery = val;
      renderFiltered();
    }

    (async () => {
      try {
        const res = await fetch('./config.json?t=' + Date.now());
        if (!res.ok) return;
        const c = await res.json();

        if (c.name)      document.getElementById('profile-name').textContent = c.name;
        if (c.handle)    document.getElementById('profile-handle').textContent = c.handle;
        if (c.bio)       document.getElementById('profile-bio').innerHTML = c.bio.replace(/\n/g, '<br>');
        if (c.profileImage) {
          const img = document.getElementById('avatar-img');
          img.src = c.profileImage + '?t=' + Date.now();
          img.style.display = 'block';
          document.getElementById('avatar-fallback').style.display = 'none';
        }

        if (c.ga_id) loadGA(c.ga_id);
        if (c.email) {
          const btn = document.getElementById('contact-email-btn');
          btn.href = 'mailto:' + c.email;
          btn.style.display = 'inline-flex';
        }
        renderSocials(c);

        if (Array.isArray(c.links)) {
          allLinks = c.links;
          if (directNum) {
            document.getElementById('filter-wrap').style.display = 'none';
            document.getElementById('back-btn').style.display = 'block';
          } else {
            const hasCats = c.links.some(l => l.category);
            document.getElementById('filter-wrap').style.display = hasCats ? 'flex' : 'block';
            if (!hasCats) document.getElementById('cat-tabs').style.display = 'none';
            renderCategoryTabs();
          }
          renderFiltered();
        }
      } catch (e) { /* 기본값 유지 */ }
    })();

    // 상단으로 버튼
    (function() {
      const btn = document.createElement('button');
      btn.className = 'scroll-top-btn';
      btn.title = '상단으로';
      btn.innerHTML = '<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>';
      btn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
      document.body.appendChild(btn);

      const sentinel = document.createElement('div');
      sentinel.style.cssText = 'position:absolute;top:60px;height:1px;width:1px;pointer-events:none;';
      document.body.prepend(sentinel);

      new IntersectionObserver(([e]) => {
        btn.classList.toggle('visible', !e.isIntersecting);
      }, { threshold: 0 }).observe(sentinel);
    })();
  </script>
</body>
</html>
